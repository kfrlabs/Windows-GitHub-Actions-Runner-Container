services:
  github-runner:
    image: windows-github-runner
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.338.2}
        GIT_VERSION: ${GIT_VERSION:-2.50.1}
    environment:
      GITHUB_URL: ${GITHUB_URL:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_REMOVE_TOKEN: ${RUNNER_REMOVE_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-windows,windows-2025}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:-_work}
      RUNNER_FORCE_RECONFIGURE: ${RUNNER_FORCE_RECONFIGURE:-}
